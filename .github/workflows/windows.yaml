name: Windows
# main への push と Pull Request で、単体テストとインストーラーのビルドを確かめる。
# v で始まるタグ（v1.1.1 など）を push すると、作ったインストーラーでリリースの下書きを作る。
# 手順は imi/DEVELOP.md の「ビルド」と「リリース」。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      # 変換に関わるパッケージのテスト。表と小型言語モデルは読ませない（入っていない場所を渡す）
      - name: Run tests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: >-
          bazelisk test --build_tests_only --build_event_json_file=bep.jsonl
          --test_env=MOZC_CONTEXT_RERANK_DIR=C:/imi_no_such_dir
          --
          //composer/... //context_rerank/... //converter/... //dictionary/...
          //engine/... //prediction/... //rewriter/... //session/... //win32/tip/...

      - name: Collect failing test logs
        if: failure()
        shell: cmd
        working-directory: .\src
        run: python build_tools\collect_test_logs.py --bep bep.jsonl --out "%GITHUB_WORKSPACE%\test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-logs
          path: test_logs
          if-no-files-found: ignore

  build:
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      # Qt のビルドは時間がかかるので、できあがったものを取っておく。
      # ただし配る版（タグ）では取っておいたものを使わず、毎回ソースから作る（できあがったものは
      # 取得のときの SHA-256 のような確かめ方がなく、そのまま配布物に入るため）
      - name: Restore Qt
        id: qt
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: python build_tools/build_qt.py --release --confirm_license

      # GitHub Actions のマシンは空きが少ないので、Qt のソースを消す
      - name: Delete Qt source
        shell: cmd
        working-directory: .\src
        run: if exist third_party\qt_src rmdir third_party\qt_src /s /q

      - name: Build installer
        shell: bash
        env:
          ANDROID_NDK_HOME: ""
          BAZELISK: bazelisk
          GH_TOKEN: ${{ github.token }}
        run: bash imi/build_msi_win.sh

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: IMi-msi
          path: imi/out/*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: IMi-msi
          path: imi/out

      # 変更点は注釈付きタグ（git tag -a）の本文に書く
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG は注釈付きのタグではありません（git tag -a で変更点を書く）"
            exit 1
          fi
          MSI="imi/out/IMi_${TAG#v}.msi"
          if [ ! -f "$MSI" ]; then
            echo "::error::タグ $TAG と src/version.bzl の版が合いません（できたもの：$(ls imi/out)）"
            exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/changes.md"
          bash imi/release_github.sh "$MSI" "$RUNNER_TEMP/changes.md"
